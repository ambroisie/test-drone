labels:
  type: exec

steps:
- name: test
  image: bash
  commands:
  - nix run 'nixpkgs#hello'

- name: notify
  image: bash
  environment:
    ADDRESS:
      from_secret: matrix_homeserver
    ROOM:
      from_secret: matrix_roomid
    USER:
      from_secret: matrix_username
    PASS:
      from_secret: matrix_password
  commands:
  - nix run 'github:ambroisie/matrix-notifier'
  when:
    status:
    - failure
    - success
